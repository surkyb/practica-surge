<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera web con CI/CD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fbf1ec;
            --ink: #5c2a3e;
            --rose: #c9667f;
            --rose-light: #f2c4cf;
            --leaf: #7d8f6a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Jost', sans-serif;
        }

        .frame {
            position: relative;
            width: 100%;
            max-width: 520px;
            padding: 40px 32px 48px;
            text-align: center;
            border: 1px solid var(--rose);
            outline: 1px solid var(--rose);
            outline-offset: 6px;
        }

        .lily {
            width: 170px;
            height: auto;
            margin: 0 auto 8px;
            display: block;
        }

        h1 {
            margin: 0 0 14px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 500;
            font-size: clamp(2rem, 8vw, 2.8rem);
            line-height: 1.15;
        }

        .rule {
            width: 48px;
            height: 1px;
            margin: 0 auto 18px;
            background: var(--rose);
            border: 0;
        }

        p {
            margin: 0 auto;
            max-width: 38ch;
            font-size: 1rem;
            line-height: 1.7;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <main class="frame">
        <svg class="lily" viewBox="-110 -130 220 290" aria-hidden="true">
            <defs>
                <path id="petal" d="M0 0 C-24 -28 -22 -70 0 -100 C22 -70 24 -28 0 0Z"/>
            </defs>

            <!-- stem and leaves -->
            <path d="M0 10 C4 60 -3 110 0 160" fill="none" stroke="var(--leaf)" stroke-width="3" stroke-linecap="round"/>
            <path d="M0 110 C-30 95 -52 100 -66 118 C-40 126 -16 124 0 110Z" fill="var(--leaf)"/>
            <path d="M1 80 C30 62 52 66 68 84 C42 94 18 94 1 80Z" fill="var(--leaf)" opacity=".85"/>

            <!-- back petals -->
            <g fill="var(--rose-light)" stroke="var(--rose)" stroke-width="1.2" stroke-linejoin="round">
                <use href="#petal" transform="rotate(0)"/>
                <use href="#petal" transform="rotate(120)"/>
                <use href="#petal" transform="rotate(240)"/>
            </g>
            <!-- front petals -->
            <g fill="#fbe0e6" stroke="var(--rose)" stroke-width="1.2" stroke-linejoin="round">
                <use href="#petal" transform="rotate(60)"/>
                <use href="#petal" transform="rotate(180)"/>
                <use href="#petal" transform="rotate(300)"/>
            </g>
            <!-- petal veins -->
            <g stroke="var(--rose)" stroke-width=".8" opacity=".55" stroke-linecap="round">
                <path d="M0 -8 L0 -78"/>
                <path d="M0 -8 L0 -78" transform="rotate(60)"/>
                <path d="M0 -8 L0 -78" transform="rotate(120)"/>
                <path d="M0 -8 L0 -78" transform="rotate(180)"/>
                <path d="M0 -8 L0 -78" transform="rotate(240)"/>
                <path d="M0 -8 L0 -78" transform="rotate(300)"/>
            </g>
            <!-- stamens -->
            <g stroke="var(--ink)" stroke-width="1" stroke-linecap="round" fill="var(--ink)">
                <path d="M0 0 L-4 -34"/><ellipse cx="-4.5" cy="-37" rx="2" ry="5" transform="rotate(-6 -4.5 -37)"/>
                <path d="M0 0 L5 -36"/><ellipse cx="5.5" cy="-39" rx="2" ry="5" transform="rotate(8 5.5 -39)"/>
                <path d="M0 0 L16 -26"/><ellipse cx="17.5" cy="-29" rx="2" ry="5" transform="rotate(32 17.5 -29)"/>
                <path d="M0 0 L-16 -26"/><ellipse cx="-17.5" cy="-29" rx="2" ry="5" transform="rotate(-32 -17.5 -29)"/>
            </g>
        </svg>

        <h1>¡Mi página está en línea!</h1>
        <hr class="rule">
        <p>Esta página se despliega automáticamente con GitHub Actions y Surge.sh.</p>
    </main>
</body>
</html>
