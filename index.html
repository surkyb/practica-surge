<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera web con CI/CD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-50: #fff0f6;
            --pink-200: #ffc2dd;
            --pink-400: #ff7eb6;
            --pink-600: #d63384;
            --lilac: #d9c2ff;
            --text: #6b3a55;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: 'Quicksand', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #ffe3f1, #f3e5ff 50%, #ffe9f0);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .card {
            position: relative;
            max-width: 560px;
            width: 100%;
            padding: 48px 32px;
            text-align: center;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border: 3px dashed var(--pink-200);
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(255, 126, 182, 0.3);
            animation: float 5s ease-in-out infinite;
        }

        h1 {
            margin: 0 0 16px;
            font-family: 'Pacifico', cursive;
            font-weight: 400;
            font-size: clamp(2rem, 7vw, 3rem);
            line-height: 1.2;
            background: linear-gradient(90deg, var(--pink-600), var(--pink-400), #a56bff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            margin: 0 0 24px;
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 999px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, var(--pink-400), #b388ff);
            box-shadow: 0 6px 16px rgba(214, 51, 132, 0.3);
        }

        .deco {
            position: absolute;
            font-size: 1.8rem;
            animation: twinkle 2.5s ease-in-out infinite;
        }
        .d1 { top: -16px; left: 24px; }
        .d2 { top: 20px; right: -12px; animation-delay: .6s; }
        .d3 { bottom: -14px; left: 40px; animation-delay: 1.2s; }
        .d4 { bottom: 24px; right: 20px; animation-delay: 1.8s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes twinkle {
            0%, 100% { transform: scale(1) rotate(0); opacity: 1; }
            50% { transform: scale(1.3) rotate(15deg); opacity: .6; }
        }
        @media (prefers-reduced-motion: reduce) {
            .card, .deco { animation: none; }
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="deco d1" aria-hidden="true">✨</span>
        <span class="deco d2" aria-hidden="true">🌸</span>
        <span class="deco d3" aria-hidden="true">💖</span>
        <span class="deco d4" aria-hidden="true">🎀</span>

        <h1>¡Mi página está en línea!</h1>
        <p>Esta página se despliega automáticamente con GitHub Actions y Surge.sh.</p>
        <span class="badge">CI/CD ✨ funcionando</span>
    </main>
</body>
</html>
